[env]
TERM = "xterm-256color"

[window]
startup_mode = "Maximized"
decorations = "none"

# Smooth cursor animation (from alacritty-smooth-cursor fork)
[cursor]
smooth_motion = true
smooth_motion_factor = 0.9
smooth_motion_spring = 0.5

# size 22 -> 22.5, to remove empty line before status line
[font]
normal = { family = "Maple Mono NF", style = "Regular"}
size = 22.5

[keyboard]
# Shift+Return sends ESC+Enter (same as Option+Enter) to work in tmux
bindings = [{ key = "Return", mods = "Shift", chars = "\u001b\r" }] 

# colors (gruvbox dark) https://terminalcolors.com/themes/gruvbox/dark/
[colors]
indexed_colors = [{ index = 16, color = "0x282828"}]

# Primary colors
[colors.primary]
background = "#282828"
foreground = "#ebdbb2"

# Normal colors
[colors.normal]
black = "#282828"
red = "#cc241d"
green = "#98971a"
yellow = "#d79921"
blue = "#458588"
magenta = "#b16286"
cyan = "#689d6a"
white = "#a89984"

# Bright colors
[colors.bright]
black = "#928374"
red = "#fb4934"
green = "#b8bb26"
yellow = "#fabd2f"
blue = "#83a598"
magenta = "#d3869b"
cyan = "#8ec07c"
white = "#ebdbb2"
