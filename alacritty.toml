[env]
TERM = "xterm-256color"

[window]
startup_mode = "Maximized"
decorations = "none"

# Smooth cursor animation (from alacritty-smooth-cursor fork)
[cursor]
smooth_motion = true
smooth_motion_factor = 0.9
smooth_motion_spring = 0.5

# size 22 -> 22.5, to remove empty line before status line
[font]
normal = { family = "Maple Mono NF", style = "Regular"}
size = 22.5

[keyboard]
# Shift+Return sends ESC+Enter (same as Option+Enter) to work in tmux
bindings = [{ key = "Return", mods = "Shift", chars = "\u001b\r" }] 

# colors (catppuccin macchiato) https://gogh-co.github.io/Gogh/
[colors]
indexed_colors = [{ index = 16, color = "0x24273A"}]

# Primary colors
[colors.primary]
background = "#24273A"
foreground = "#CAD3F5"

# Normal colors
[colors.normal]
black = "#494D64"
red = "#ED8796"
green = "#A6DA95"
yellow = "#EED49F"
blue = "#8AADF4"
magenta = "#F5BDE6"
cyan = "#8BD5CA"
white = "#B8C0E0"

# Bright colors
[colors.bright]
black = "#5B6078"
red = "#ED8796"
green = "#A6DA95"
yellow = "#EED49F"
blue = "#8AADF4"
magenta = "#F5BDE6"
cyan = "#8BD5CA"
white = "#A5ADCB"
