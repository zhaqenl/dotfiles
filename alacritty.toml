[env]
TERM = "xterm-256color"

[window]
startup_mode = "Maximized"
decorations = "none"

# Smooth cursor animation (from alacritty-smooth-cursor fork)
[cursor]
smooth_motion = true
smooth_motion_factor = 0.9
smooth_motion_spring = 0.5

# size 22 -> 22.5, to remove empty line before status line
[font]
normal = { family = "GeistMono Nerd Font", style = "Regular"}
size = 22.5

[keyboard]
# Shift+Return sends ESC+Enter (same as Option+Enter) to work in tmux
bindings = [{ key = "Return", mods = "Shift", chars = "\u001b\r" }] 

# colors (ayu mirage) https://github.com/ayu-theme/ayu-vim
[colors]
indexed_colors = [{ index = 16, color = "0x1F2430"}]

# Primary colors
[colors.primary]
background = "#1F2430"
foreground = "#CBCCC6"

# Normal colors
[colors.normal]
black = "#191E2A"
red = "#ED8274"
green = "#A6CC70"
yellow = "#FFD173"
blue = "#6DCBFA"
magenta = "#CFBAFA"
cyan = "#90E1C6"
white = "#C7C7C7"

# Bright colors
[colors.bright]
black = "#686868"
red = "#F28779"
green = "#BAE67E"
yellow = "#FFD580"
blue = "#73D0FF"
magenta = "#D4BFFF"
cyan = "#95E6CB"
white = "#FFFFFF"
