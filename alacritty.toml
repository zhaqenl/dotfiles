[env]
TERM = "xterm-256color"

[window]
startup_mode = "Maximized"
decorations = "none"

# Smooth cursor animation (from alacritty-smooth-cursor fork)
[cursor]
smooth_motion = true
smooth_motion_factor = 0.9
smooth_motion_spring = 0.5

# size 22 -> 22.5, to remove empty line before status line
[font]
normal = { family = "Maple Mono NF", style = "Regular"}
size = 22.5

[keyboard]
# Shift+Return sends ESC+Enter (same as Option+Enter) to work in tmux
bindings = [{ key = "Return", mods = "Shift", chars = "\u001b\r" }] 

# colors (melange dark) https://github.com/savq/melange-nvim
[colors]
indexed_colors = [{ index = 16, color = "0x292522"}]

# Primary colors
[colors.primary]
background = "#292522"
foreground = "#ECE1D7"

# Normal colors
[colors.normal]
black = "#34302C"
red = "#BD8183"
green = "#78997A"
yellow = "#E49B5D"
blue = "#7F91B2"
magenta = "#B380B0"
cyan = "#7B9695"
white = "#C1A78E"

# Bright colors
[colors.bright]
black = "#867462"
red = "#D47766"
green = "#85B695"
yellow = "#EBC06D"
blue = "#A3A9CE"
magenta = "#CF9BC2"
cyan = "#89B3B6"
white = "#ECE1D7"
