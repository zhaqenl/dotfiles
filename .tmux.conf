# ~/.tmux.conf

# Remap prefix from Ctrl+b to Ctrl+z
unbind C-b
set-option -g prefix C-z
bind-key C-z send-prefix

# Swap c and t bindings (c=clock, t=new window)
bind-key t new-window -c "#{pane_current_path}"
bind-key c clock-mode
bind-key '"' split-window -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"

# Move current window to a specific index, shifting occupants.
# -b (insert before) works for backward moves; -a (insert after) for forward,
# because renumber-windows compacts the source gap and undoes same-direction shifts.
bind-key M command-prompt -p "move window to:" {
  if-shell -F "#{e|>:#{window_index},%1}" "move-window -b -t '%1'" "move-window -a -t '%1'"
}

set -g @plugin 'tmux-plugins/tpm' # mandatory
set -g @plugin 'tmux-plugins/tmux-sensible' # optional recommended

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# When windows are deleted, update their “indexes”. Example:
# off:
# 1 2 3 4 5 -> 1 2 4 5
# on:
# 1 2 3 4 5 -> 1 2 3 4
set -g renumber-windows on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Windows/Panes Restoration; Configs are loaded first due to:
# https://github.com/tmux-plugins/tmux-continuum/issues/42#issuecomment-732813348
set -g @continuum-restore 'on'
# set -g @continuum-save-interval '1'
set -g @continuum-boot 'on'

# set -g @plugin 'ofirgall/tmux-window-name'

set -g @plugin 'tmux-plugins/tmux-resurrect'
# Check
# https://github.com/tmux-plugins/tmux-resurrect/issues/287#issuecomment-3100533681
# for why one of user’s tmux.service’s `[ExecStop]` lines were
# disabled.

set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
# Fix pane cwd: read shell's actual cwd from /proc instead of foreground process's
set -g @resurrect-hook-post-save-layout '~/dotfiles/tmux-resurrect-fix-pane-cwd.sh'
# Special resurrect process syntax to handle flags?; Refer to
# resurrect FAQs(?) for more detailed explanations/scenarios
# set -g @resurrect-processes '"~emacsclient->emacsclient *" "docker compose up"'

# --- Melange rounded-pill status bar (palette: savq/melange-nvim) ---
set -g status-style "bg=default,fg=#C1A78E"
set -g status-left-length 40
set -g status-right-length 150

# Left: session name + window count pill
set -g status-left '#[fg=#EBC06D,bg=default]#[fg=#1F1B19,bg=#EBC06D,bold]#S #{session_windows}#[fg=#EBC06D,bg=default] '

# Window pills: current vs inactive
setw -g window-status-separator ' '
setw -g window-status-format '#[fg=#34302C,bg=default]#[fg=#C1A78E,bg=#34302C]#I:#W#F#[fg=#34302C,bg=default]'
setw -g window-status-current-format '#[fg=#403A34,bg=default]#[fg=#ECE1D7,bg=#403A34,bold]#I:#W#F#[fg=#403A34,bg=default]'

# prefix-highlight in Melange accent
set -g @prefix_highlight_fg '#1F1B19'
set -g @prefix_highlight_bg '#D47766'

# Right: prefix-highlight | cwd (30-char left-truncated, ~ substitution) | date | battery+clock
set -g status-right '#{prefix_highlight} #[fg=#34302C,bg=default]#[fg=#C1A78E,bg=#34302C]#{=-30:#{s|/home/lenovo|~|:pane_current_path}}#[fg=#34302C,bg=default] #[fg=#867462,bg=default]#[fg=#1F1B19,bg=#867462]%A %Y-%m-%d#[fg=#867462,bg=default] #[fg=#EBC06D,bg=default]#[fg=#1F1B19,bg=#EBC06D,bold]#(echo "$(cat /sys/class/power_supply/BAT0/status 2>/dev/null)" | grep -qE "Charging|Full" && printf "⚡" ; cat /sys/class/power_supply/BAT0/capacity 2>/dev/null || cat /sys/class/power_supply/BAT1/capacity 2>/dev/null)%% %H:%M#[fg=#EBC06D,bg=default]'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Manually added, since without this, continuum auto-save does not seem to work
# run-shell /home/lenovo/.tmux/plugins/tmux-continuum/continuum.tmux
